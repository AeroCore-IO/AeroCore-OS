name: Generate Release

on:
  workflow_call:
    inputs:
      handwritten:
        required: false
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      handwritten:
        description: 'Small changelog about changes in this build'
        required: false
        type: string
      release_tag:
        required: true
        type: string

permissions: {}

jobs:
  generate-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read


    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR with ORAS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Align release tag with build commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git tag --force "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${RELEASE_TAG}"
          echo "Release tag ${RELEASE_TAG} now points to ${GITHUB_SHA}."

      - name: Determine release channel
        id: target
        run: |
          target="${GITHUB_REF_NAME}"
          [[ "${target}" == "main" ]] && target="stable"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Generate package and commit changelog
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HANDWRITTEN: ${{ inputs.handwritten }}
        run: |
          python3 .github/scripts/generate_changelog.py \
            --image "${IMAGE,,}" \
            --repository "${GITHUB_REPOSITORY}" \
            --current "${RELEASE_TAG}" \
            --channel "${{ steps.target.outputs.target }}" \
            --handwritten "${HANDWRITTEN}" \
            --output release-notes.md

      - name: Generate release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "${{ inputs.release_tag }}"
          name: "${{ inputs.release_tag }}"
          body_path: release-notes.md
          prerelease: ${{ steps.target.outputs.target != 'stable' }}
          make_latest: ${{ steps.target.outputs.target == 'stable' }}
