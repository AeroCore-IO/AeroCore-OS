name: Validate installer ISO

on:
  pull_request:
    paths:
      - "Justfile"
      - "installer/**"
      - "just_scripts/build-installer-iso.sh"
      - ".github/workflows/build-installer-iso.yml"
      - ".github/workflows/validate-installer-iso.yml"

permissions:
  contents: read

jobs:
  validate-installer-iso:
    name: Validate installer ISO inputs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |file| YAML.load_file(file) }'

      - name: Validate Justfile formatting
        run: |
          just --unstable --fmt --check -f Justfile

      - name: Validate build scripts
        run: |
          for script in build_files/*.sh installer/*.sh just_scripts/*.sh; do
            bash -n "$script"
          done
          bash -n system_files/usr/libexec/aerocore-instruments-setup
