# Anaconda configuration for the AeroCore live installer.
#
# This deliberately does not inherit the Fedora KDE profile: that profile
# hides the accounts screen, which would leave an interactive bootc install
# without a user account. Keep the account page available so the installer
# creates the user's requested login during installation.

[Profile]
profile_id = aerocore

[Profile Detection]
os_id = aerocore

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
# Leave anaconda-screen-accounts visible. The user account is configured in
# the WebUI rather than via an unused Lorax template.
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
